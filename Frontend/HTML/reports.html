<!DOCTYPE html>
<html lang="en">
<head>
  <title>Reports | Admin</title>
  <link rel="stylesheet" href="../css/reports.css">
</head>
<body>

<div class="container">

  <h2>Reports</h2>

  <!-- FILTERS -->
  <div class="filters">
    <label>
      From Date:
      <input type="date" id="fromDate">
    </label>

    <label>
      To Date:
      <input type="date" id="toDate">
    </label>

    <label>
      Employee:
      <select id="employee">
        <option value="">All</option>
        <option>Rahul Patil</option>
        <option>Sneha More</option>
      </select>
    </label>

    <label>
      Project:
      <select id="project">
        <option value="">All</option>
        <option>Payroll App</option>
        <option>HR Portal</option>
      </select>
    </label>

    <button onclick="generateReport()">Generate Report</button>
  </div>

  <!-- REPORT TABLE -->
  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Employee</th>
        <th>Project</th>
        <th>Total Hours</th>
      </tr>
    </thead>

    <tbody id="reportTable">
      <tr>
        <td>12-08-2025</td>
        <td>Rahul Patil</td>
        <td>Payroll App</td>
        <td>8</td>
      </tr>

      <tr>
        <td>12-08-2025</td>
        <td>Sneha More</td>
        <td>HR Portal</td>
        <td>7</td>
      </tr>
    </tbody>
  </table>

  <!-- EXPORT BUTTONS -->
  <div class="export">
    <button onclick="exportPDF()">Export PDF</button>
    <button onclick="exportExcel()">Export Excel</button>
  </div>

</div>

<script src="../js/reports.js"></script>
</body>
</html>
