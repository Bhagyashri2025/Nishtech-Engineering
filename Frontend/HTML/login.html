<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login | Nishtek Engineering</title>
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">

    <img src="../assets/nishtek-logo.png" alt="Nishtek Engineering Logo" class="logo">

    <h3>Employee Login</h3>
    <p class="subtitle">Timesheet & Project Tracking System</p>

    <input type="email" id="email" placeholder="Email Address">
    <input type="password" id="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <p class="link">
      New user? <a href="signup.html">Create Account</a>
    </p>

    <p id="error"></p>

  </div>
</div>

<script src="../js/login.js"></script>
</body>
</html>
