<!DOCTYPE html>
<html lang="en">
<head>
  <title>Profile | Settings</title>
  <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

<div class="container">

  <h2>Profile Settings</h2>

  <div class="profile-box">

    <div class="photo-section">
      <img src="../assets/user.png" alt="Profile Photo">
      <button>Change Photo</button>
    </div>

    <div class="form-section">
      <label>Name</label>
      <input type="text" id="name" value="Rahul Patil">

      <label>Email</label>
      <input type="email" id="email" value="rahul@mail.com" readonly>

      <label>Role</label>
      <input type="text" id="role" value="Employee" readonly>

      <label>Designation</label>
      <input type="text" id="designation" value="Software Engineer">

      <label>Password</label>
      <input type="password" id="password" placeholder="Change Password">

      <button onclick="updateProfile()">Update Profile</button>

      <p id="message"></p>
    </div>

  </div>

</div>

<script src="../js/profile.js"></script>
</body>
</html>
